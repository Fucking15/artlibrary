open_questions:
  - question_zh: 1906–1907 年的油画（如 1907 年 Czihaczek 肖像）用什么支撑与颜料？
    why_open_zh: 目前只见于二手图注（布面油画、42.5 × 62.5 cm），未取得馆方对象记录，故本期不声明油画覆盖。
    needs: [B]
  - question_zh: 本期素描里"连续线"的具体形态能否用图像核对？
    why_open_zh: 本期登记的纸上作品尚无 IIIF manifest，无法把 claim 指到具体笔画的区域。
    needs: [B]

