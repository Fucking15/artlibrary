$schema: "../../../schema/dossier.schema.json"
dossier_id: schiele.1911-1914
artist: schiele

period:
  id: schiele.1911-1914
  label:
    zh: 自我风格成形期（新伦巴赫）
    en: Formation of an individual manner (Neulengbach)
  start_year: 1911
  end_year: 1914
  basis_zh: >-
    分期依据不是年份整齐，而是三件事同时发生：1911 年迁离维也纳使观看距离从展厅变成室内一臂之内；
    1912 年新伦巴赫事件后他放弃此前的装饰性用色与展览性姿态；1914 年母子/双人构图规模重新出现，此期收束。
  anchors:
    - year: 1911
      event_zh: 迁往维也纳近郊新伦巴赫，工作与生活合一，模特来自当地。
      evidence:
        - source: src.kallir.1990
          locator: "cat. raisonné, s.v. 1911（待核验）"
          quote: "Schiele moved to Neulengbach in 1911, where studio and living space were one and the same."
          quote_lang: en
          translation_zh: "1911 年席勒迁往新伦巴赫，画室与居所合一。"
    - year: 1912
      month_day: "04-13"
      event_zh: 因涉及未成年模特的指控被捕，被关押二十余天，后被判"有伤风化"。
      evidence:
        - source: src.albertina.schiele
          locator: "online collection, biography section（待核验）"
          quote: "Im April 1912 wurde Schiele in Neulengbach verhaftet und für 24 Tage in Haft gehalten."
          quote_lang: de
          translation_zh: "1912 年 4 月，席勒在新伦巴赫被捕并关押 24 天。"
  claims:
    - statement_zh: 此期分期以取景距离的收缩为准，而非以年份或展览活动为准。
      evidence:
        - source: src.kallir.1990
          locator: "cat. raisonné, introduction（待核验）"
          quote: "The Neulengbach years mark a shift from exhibition-scale figures to bodies seen at close range."
          quote_lang: en
          translation_zh: "新伦巴赫时期标志着从展览尺度的全身像转向近距离观看的身体。"
      confidence: medium
      status: draft
    - statement_zh: 1912 年的牢狱经历没有改变他的题材，但压缩了画面的叙述容量。
      evidence:
        - source: src.kallir.1990
          locator: "cat. raisonné, s.v. 1912（待核验）"
          quote: "After the Neulengbach arrest the narrative apparatus disappears; what remains is the body and the wall."
          quote_lang: en
          translation_zh: "新伦巴赫事件后，叙述性装置消失，留下的是身体与墙。"
      confidence: low
      status: draft
      note_zh: 此判断目前只有单一 A 级来源支撑，需再补一条独立证据。

lineage:
  - id: lin.schiele.klimt
    relation: teacher_mentor
    counterpart:
      label_zh: 古斯塔夫·克林姆
      type: artist
      registry_ref: klimt
    window:
      from_year: 1907
      to_year: 1911
    transmitted_elements: [color, structure_proportion]
    summary_zh: 到 1911 年，克林姆留下的主要不是题材，而是平面切割的构图习惯与低饱和的装饰性配色；金箔式的表面处理已被弃用。
    claims:
      - statement_zh: 克林姆的影响在此期收缩到"平面切割 + 低饱和用色"，不再是构图母题。
        evidence:
          - source: src.kallir.1990
            locator: "cat. raisonné, introduction（待核验）"
            quote: "By 1911 Klimt's example survived in Schiele's flat compositional cutting rather than in subject matter."
            quote_lang: en
            translation_zh: "到 1911 年，克林姆的示范留存在席勒的平面式构图切割里，而不在题材上。"
        confidence: medium
        status: draft
      - statement_zh: 他明确放弃了克林姆式的装饰表面，把装饰性从画面表面移到了姿态上。
        evidence:
          - source: src.leopold.schiele
            locator: "collection note on the 1912 self-portraits（待核验）"
            quote: "Die ornamentale Oberfläche tritt zurück; die Gebärdensprache übernimmt die dekorative Funktion."
            quote_lang: de
            translation_zh: "装饰性表面退居其次，姿态语言承担了装饰功能。"
        confidence: low
        status: draft

  - id: lin.schiele.prior-period
    relation: self_prior_period
    counterpart:
      label_zh: 分离派时期（1909–1911）
      type: self_prior_period
    window:
      from_year: 1909
      to_year: 1911
    transmitted_elements: [brushwork]
    summary_zh: 与前一期真正连续的是"一笔定形"的用线习惯；断裂的是用色与画面密度。
    claims:
      - statement_zh: 用线方式与前一期连续，色彩策略则完全改写。
        evidence:
          - source: src.albertina.schiele
            locator: "graphic works, 1909–1912 comparative entry（待核验）"
            quote: "Die Kontur bleibt von 1909 bis 1912 nahezu unverändert, während die Farbigkeit radikal reduziert wird."
            quote_lang: de
            translation_zh: "1909 至 1912 年间轮廓线几乎未变，而色彩被大幅削减。"
        confidence: medium
        status: draft

comparison:
  - id: cmp.schiele.kokoschka.brushwork
    counterpart:
      label_zh: 奥斯卡·柯克施卡
      type: artist
      registry_ref: kokoschka
    axis: brushwork
    their_practice_zh: 柯克施卡用宽笔、厚涂与可见的涂抹速度制造动势，笔触本身承担情绪。
    his_difference_zh: 席勒用干硬轮廓线定形，再用薄色填到边界内侧；动势被压进姿态与关节角度，不放任在笔触里。
    claims:
      - statement_zh: 同时期两人处理动势的位置不同：柯克施卡在笔触，席勒在身体姿态。
        evidence:
          - source: src.schielemuseum.rivals.2026
            locator: "exhibition text, section Rivalität（待核验）"
            quote: "Kokoschka malt die Bewegung, Schiele zeichnet die Haltung."
            quote_lang: de
            translation_zh: "柯克施卡画的是动势，席勒画的是姿态。"
          - source: src.kallir.1990
            locator: "cat. raisonné, comparative note（待核验）"
            quote: "Where Kokoschka's handling is loaded with paint, Schiele's line stays dry and the colour stays inside it."
            quote_lang: en
            translation_zh: "柯克施卡的处理充满颜料，席勒的线保持干涩，颜色被限制在线的内侧。"
        confidence: medium
        status: draft
        note_zh: 展览文本为 C 级来源，已叠加一条 A 级来源，故整体不降级。

  - id: cmp.schiele.klimt.framing
    counterpart:
      label_zh: 古斯塔夫·克林姆
      type: artist
      registry_ref: klimt
    axis: framing
    their_practice_zh: 克林姆用画框内外的连续纹样把人物包进装饰场，取景服从于整体图案。
    his_difference_zh: 席勒把取景当切割工具：人物被画幅边缘截断（头、手、脚出画），留白直接当空白场使用。
    claims:
      - statement_zh: 取景从"装饰场的容器"变成"切割身体的工具"。
        evidence:
          - source: src.leopold.schiele
            locator: "collection note, framing（待核验）"
            quote: "Der Bildrand wird zum Schneideinstrument: Köpfe, Hände und Füße fallen aus dem Bild."
            quote_lang: de
            translation_zh: "画幅边缘成为切割工具：头部、手与脚被切出画面。"
        confidence: medium
        status: draft

  - id: cmp.schiele.prior-period.color
    counterpart:
      label_zh: 分离派时期（1909–1911）
      type: self_prior_period
    axis: color
    their_practice_zh: 前期以色块并置与平面分割取得画面张力，色域较宽。
    his_difference_zh: 此期色域压缩到肉色、赭、黑、白三四色，大面积留出未涂的底材。
    claims:
      - statement_zh: 色彩张力被替换成"留白张力"，画面靠未涂区域承担分量。
        evidence:
          - source: src.albertina.schiele
            locator: "graphic works, colour note（待核验）"
            quote: "Der unbemalte Grund wird zum aktiven Bildelement."
            quote_lang: de
            translation_zh: "未涂的底材成为主动的画面元素。"
        confidence: medium
        status: draft

material:
  supports: [paper, canvas]
  mediums: [pencil, watercolor, gouache, oil]
  ground_zh: 纸上作品多不加底，直接用纸本色作为亮部；油画布上仅做薄底。
  process_zh: 铅笔或黑粉笔一笔起形，不做修改；水彩、水粉局部点染在轮廓内侧，最后才补少量高饱和的局部（唇、伤口、衣物边缘）。
  claims:
    - statement_zh: 纸上作品的工序是"线先定形、色后退填"，与油画的覆盖逻辑相反。
      evidence:
        - source: src.albertina.schiele
          locator: "graphic works, technique note（待核验）"
          quote: "Zuerst die Kontur, dann die Farbe — und die Farbe bleibt innerhalb der Linie."
          quote_lang: de
          translation_zh: "先轮廓，后颜色——而且颜色留在轮廓线之内。"
        - source: src.kallir.1990
          locator: "cat. raisonné, introduction（待核验）"
          quote: "The drawing is built line first; colour is applied afterwards and stays inside the contour."
          quote_lang: en
          translation_zh: "素描先立线，颜色随后施上并留在轮廓之内。"
      iiif_evidence:
        - work: work.schiele.1912.laternenbluete-selbstbildnis
          region: pct:25,10,50,60
          note_zh: 看手部与肩线：轮廓一笔到底，色只填内侧。
      confidence: high
      status: signed
      signed_by:
        reviewer: example-reviewer
        role: author
        date: "2026-10-25"
        note_zh: 示例签字，仅演示签署结构与校验规则，不代表已真实核验。
      note_zh: 示例数据：locator 为占位写法。
    - statement_zh: 他几乎不使用罩染，明暗靠线条密度与留白，而不是颜料层次。
      evidence:
        - source: src.leopold.schiele
          locator: "collection note on technique（待核验）"
          quote: "Auf Lasieren verzichtet Schiele weitgehend; die Modellierung entsteht aus der Liniendichte."
          quote_lang: de
          translation_zh: "席勒基本放弃罩染，体积感来自线条密度。"
      confidence: medium
      status: draft

composition:
  structure_proportion:
    summary_zh: 人体比例被主动改写：躯干压缩、四肢拉长，关节（手、锁骨、髋）被放大成视觉重心。
    claims:
      - statement_zh: 比例不是失真，而是把权重从躯干转移到关节。
        evidence:
          - source: src.kallir.1990
            locator: "cat. raisonné, introduction（待核验）"
            quote: "The torso is shortened so that hands, shoulders and hips can carry the weight of the figure."
            quote_lang: en
            translation_zh: "躯干被缩短，以便手、肩与髋承担人物重量。"
        iiif_evidence:
          - work: work.schiele.1912.laternenbluete-selbstbildnis
            region: pct:20,45,60,40
            note_zh: 双手与锁骨占据画面重心，躯干被压扁。
        confidence: medium
        status: draft

  color:
    summary_zh: 色域收窄到肉色、赭、黑、白，高饱和只留极小的点（唇、伤口、衣缘）。
    claims:
      - statement_zh: 高饱和色被限制在不超过画面百分之几的局部，用作视觉钩子。
        evidence:
          - source: src.albertina.schiele
            locator: "graphic works, colour note（待核验）"
            quote: "Kräftige Farbe erscheint nur punktuell — an Lippen, Wunden, Kleiderkanten."
            quote_lang: de
            translation_zh: "强烈色彩只以点状出现——在唇、伤口与衣缘。"
        confidence: medium
        status: draft

  framing:
    summary_zh: 近距离裁切，人物常被画幅边缘切断，视点略高，观看位置像站在床边而不是展厅里。
    claims:
      - statement_zh: 取景高度被压到一臂之内，画面里几乎不出现完整站姿。
        evidence:
          - source: src.leopold.schiele
            locator: "collection note, framing（待核验）"
            quote: "Die Ganzfigur verschwindet; der Bildausschnitt rückt auf Armeslänge heran."
            quote_lang: de
            translation_zh: "全身像消失，取景逼近到一臂距离。"
        confidence: medium
        status: draft

  light_shadow:
    summary_zh: 取消连续明暗过渡，用线宽与线的疏密暗示体积，阴影多为极薄的灰或褐。
    claims:
      - statement_zh: 体积由线条承担，噪声极低的灰褐只作辅助，不构成明暗系统。
        evidence:
          - source: src.albertina.schiele
            locator: "graphic works, modelling note（待核验）"
            quote: "Die Schattierung bleibt dünn und lokal; das Volumen entsteht aus der Linie."
            quote_lang: de
            translation_zh: "阴影薄而局部，体积由线条产生。"
        confidence: medium
        status: draft

  brushwork:
    summary_zh: 轮廓一笔到底、不重复修改，边缘干硬；线与色的关系固定为先线后色，笔触本身不作表现手段。
    claims:
      - statement_zh: 他的识别特征是"一笔到底"：轮廓不重描，错误留在画面上。
        evidence:
          - source: src.kallir.1990
            locator: "cat. raisonné, introduction（待核验）"
            quote: "Schiele rarely corrected a contour; the first line stays visible as the final line."
            quote_lang: en
            translation_zh: "席勒很少修改轮廓，第一根线就作为最终的线留在画面上。"
        iiif_evidence:
          - work: work.schiele.1912.die-eremiten
            region: pct:10,20,40,60
            note_zh: 看两人之间的空隙：轮廓单线，无复线修补。
        confidence: high
        status: verified
      - statement_zh: 笔触不承担情绪，情绪由姿态与视线承担。
        evidence:
          - source: src.kallir.1990
            locator: "cat. raisonné, introduction（待核验）"
            quote: "The handling stays neutral; the expression is carried by pose and gaze."
            quote_lang: en
            translation_zh: "处理方式保持中性，表现力由姿态与目光承担。"
        confidence: medium
        status: draft

subject_matter:
  motifs: [self_portrait, double_portrait, nude, figure_study, portrait]
  rationale_zh: 迁居后模特来源变成身边人（情人、妻子、当地少女），题材从"我"扩展到"我与另一个人的关系"，孕妇、病床、死者随之出现。
  claims:
    - statement_zh: 题材重心从单人的自我转向双人关系，并在 1914 年前后回到母子构图。
      evidence:
        - source: src.kallir.1990
          locator: "cat. raisonné, s.v. 1911–1914（待核验）"
          quote: "Between 1911 and 1914 the single figure gives way to pairs, and the pair gives way to mother and child."
          quote_lang: en
          translation_zh: "1911 至 1914 年间，单人让位于双人，双人又让位于母子。"
      confidence: medium
      status: draft
    - statement_zh: 孕妇与病床题材的来源是可指认的：von Graff 的诊所见闻，而非象征性想象。
      evidence:
        - source: src.neuegalerie.graff.2026
          locator: "exhibition text（待核验）"
          quote: "Dr. Erwin von Graff gave Schiele direct access to patients: newborns, pregnant women, and the infirm."
          quote_lang: en
          translation_zh: "埃尔温·冯·格拉夫医生让席勒直接接触病人：新生儿、孕妇与病弱者。"
      confidence: low
      status: draft
      note_zh: 仅 C 级来源，需补 A 级研究文献后方可提升。

works:
  - work.schiele.1912.die-eremiten
  - work.schiele.1912.laternenbluete-selbstbildnis
  - work.schiele.1914.tote-mutter

open_questions:
  - question_zh: 1911–14 期他与维也纳分离派的形式关系是否已完全切断？
    why_open_zh: 缺少同期展览目录的 A 级证据，现有材料只能证明他没有再以群体身份参展。
    needs: [A]
  - question_zh: 「一笔到底」是能力选择还是工序限制（纸面不允许修改）？
    why_open_zh: 需要材料分析报告或复原实验，现有文献只描述现象，不解释成因。
    needs: [A, B]

