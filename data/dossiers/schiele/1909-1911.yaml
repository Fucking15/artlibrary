open_questions:
  - question_zh: 1910 年的"突破"能否用单件作品的技法变化来定位？
    why_open_zh: 现有材料都是通述（"1910 年是转折点"），没有逐件定年的技术记录，无法把转折点钉到某一张画上。
    needs: [A]
  - question_zh: 本期水彩与水粉的实际配比能否被检测？
    why_open_zh: 掺胶增稠的说法来自 C 级通述，尚无颜料分析或修复报告佐证。
    needs: [A, B]

meta:
  status: draft
  version: 0.1.0
  created: "2026-10-25"
  updated: "2026-10-25"
  notes_zh: >-
    2026-10-25 新建。本期只用纸上彩色作品立档：材质记录来自提森-博内米萨（1910 自画像）与大都会（1911 自画像），
    其余为德/法文百科通述（C 级），已逐条标 low 并写缺口。分期边界取"退学—搬离维也纳"，属编辑取舍，另在 open_questions 标注。
