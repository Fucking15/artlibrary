name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No concurrency group on purpose: a run that hangs before Pages exists (or during a Pages
# incident) would otherwise hold the lock and queue every later deploy behind it forever.

jobs:
  build:
    name: build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # A site built from data that does not validate would publish claims nobody checked.
      - name: Validate data
        run: npm run validate

      - name: Build site payload
        run: npm run build:site

      # Pages has to be switched on once by someone with admin rights on the repository:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # Failing fast with that sentence beats hanging on configure-pages for ten minutes.
      - name: Check that Pages is enabled
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "GET /pages -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::GitHub Pages is not enabled for this repository. A repository admin must open Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
